name: game-stream-vps

services:
  caddy:
    image: caddy:2.11.9-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to the player hostname}
      API_PORT: ${API_PORT:-3100}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../game-session-service/frontend/src/dist
        target: /srv/player
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4.19.2-r0
    network_mode: host
    restart: unless-stopped
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --listening-ip=${TURN_LISTEN_IP:?Set TURN_LISTEN_IP to the VPS interface IPv4}
      - --relay-ip=${TURN_LISTEN_IP}
      - --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP to the public IPv4}/${TURN_LISTEN_IP}
    volumes:
      - type: bind
        source: ./local/turnserver.conf
        target: /etc/coturn/turnserver.conf
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/lib/coturn

volumes:
  caddy_data:
  caddy_config:
